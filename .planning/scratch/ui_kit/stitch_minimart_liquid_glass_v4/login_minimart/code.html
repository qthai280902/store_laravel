<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MiniMart - Login / Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed-dim": "#92d78b",
                    "on-surface": "#181d16",
                    "on-error-container": "#93000a",
                    "tertiary-fixed": "#ffd9e2",
                    "tertiary-fixed-dim": "#ffb0c8",
                    "outline-variant": "#c0c9bb",
                    "on-primary-container": "#76b970",
                    "inverse-surface": "#2d322b",
                    "tertiary-container": "#741a41",
                    "primary-fixed": "#aef4a5",
                    "on-secondary-fixed": "#321300",
                    "on-tertiary-container": "#f985ad",
                    "primary-container": "#00490e",
                    "on-secondary-fixed-variant": "#743400",
                    "inverse-primary": "#92d78b",
                    "on-primary-fixed": "#002203",
                    "on-secondary": "#ffffff",
                    "secondary-fixed": "#ffdbc8",
                    "secondary-container": "#ff9650",
                    "secondary-fixed-dim": "#ffb68b",
                    "on-primary": "#ffffff",
                    "secondary": "#994700",
                    "on-primary-fixed-variant": "#0e5217",
                    "outline": "#717a6d",
                    "on-tertiary-fixed": "#3e001d",
                    "on-surface-variant": "#41493e",
                    "on-tertiary-fixed-variant": "#7f234a",
                    "on-background": "#181d16",
                    "surface-container-high": "#e6eadf",
                    "surface-variant": "#e0e4d9",
                    "surface-bright": "#f7fbf0",
                    "tertiary": "#56002b",
                    "surface-container": "#ebefe5",
                    "surface-container-low": "#f1f5ea",
                    "surface": "#f7fbf0",
                    "error": "#ba1a1a",
                    "surface-dim": "#d7dbd1",
                    "primary": "#003006",
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#eef2e7",
                    "on-tertiary": "#ffffff",
                    "surface-container-highest": "#e0e4d9",
                    "error-container": "#ffdad6",
                    "surface-tint": "#2b6b2c",
                    "background": "#f7fbf0",
                    "on-secondary-container": "#6f3200"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base_unit": "8px",
                    "max_width": "1280px",
                    "gutter": "24px",
                    "margin_desktop": "40px"
            },
            "fontFamily": {
                    "headline-lg": [
                            "Plus Jakarta Sans"
                    ],
                    "body-lg": [
                            "Plus Jakarta Sans"
                    ],
                    "headline-lg-mobile": [
                            "Plus Jakarta Sans"
                    ],
                    "display-lg": [
                            "Plus Jakarta Sans"
                    ],
                    "label-md": [
                            "Plus Jakarta Sans"
                    ]
            },
            "fontSize": {
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "1.3",
                                    "fontWeight": "700"
                            }
                    ],
                    "body-lg": [
                            "18px",
                            {
                                    "lineHeight": "1.6",
                                    "fontWeight": "400"
                            }
                    ],
                    "headline-lg-mobile": [
                            "28px",
                            {
                                    "lineHeight": "1.3",
                                    "fontWeight": "700"
                            }
                    ],
                    "display-lg": [
                            "48px",
                            {
                                    "lineHeight": "1.2",
                                    "fontWeight": "800"
                            }
                    ],
                    "label-md": [
                            "14px",
                            {
                                    "lineHeight": "1.4",
                                    "fontWeight": "600"
                            }
                    ]
            }
    },
        },
      }
    </script>
<style>
        /* Glassmorphism Utilities */
        .glass-tier-4 {
            background-color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(50px) saturate(180%);
            -webkit-backdrop-filter: blur(50px) saturate(180%);
            border-top: 1.5px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .glass-tier-2 {
            background-color: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-top: 1.5px solid rgba(255, 255, 255, 0.7);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Ambient Orbs */
        .orb-primary {
            background: radial-gradient(circle, var(--tw-colors-primary-fixed) 0%, rgba(255,255,255,0) 70%);
            width: 600px;
            height: 600px;
            border-radius: 50%;
            position: absolute;
            top: -100px;
            left: -100px;
            z-index: -1;
            opacity: 0.6;
            animation: float 20s ease-in-out infinite alternate;
        }

        .orb-secondary {
            background: radial-gradient(circle, var(--tw-colors-secondary-fixed) 0%, rgba(255,255,255,0) 70%);
            width: 500px;
            height: 500px;
            border-radius: 50%;
            position: absolute;
            bottom: -50px;
            right: -50px;
            z-index: -1;
            opacity: 0.5;
            animation: float 25s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 50px) scale(1.05); }
            100% { transform: translate(-20px, 20px) scale(0.95); }
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-lg text-body-lg text-on-surface">
<!-- Ambient Background -->
<div class="orb-primary"></div>
<div class="orb-secondary"></div>
<!-- Main Container -->
<main class="w-full max-w-[480px] p-gutter relative z-10">
<!-- Logo -->
<div class="text-center mb-8">
<h1 class="font-display-lg text-display-lg text-primary">MiniMart</h1>
</div>
<!-- Auth Card -->
<div class="glass-tier-4 rounded-[20px] shadow-2xl p-8 relative overflow-hidden">
<!-- Tabs -->
<div class="flex border-b border-outline-variant/30 mb-8">
<button class="flex-1 pb-4 text-center font-label-md text-label-md text-primary border-b-2 border-primary transition-colors">
                    Sign In
                </button>
<button class="flex-1 pb-4 text-center font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors">
                    Create Account
                </button>
</div>
<!-- Form -->
<form class="flex flex-col gap-6">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<input class="w-full bg-white border border-outline-variant rounded-xl px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow" id="email" placeholder="name@example.com" type="email"/>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot?</a>
</div>
<input class="w-full bg-white border border-outline-variant rounded-xl px-4 py-3 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md rounded-full py-4 shadow-lg hover:bg-primary-container hover:text-on-primary-container transition-all mt-2" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-8">
<div class="h-px bg-outline-variant/50 flex-1"></div>
<span class="font-label-md text-label-md text-on-surface-variant">or continue with</span>
<div class="h-px bg-outline-variant/50 flex-1"></div>
</div>
<!-- Social Logins -->
<div class="flex gap-4">
<button class="flex-1 glass-tier-2 rounded-xl py-3 flex items-center justify-center gap-2 hover:bg-white/40 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mail</span>
<span class="font-label-md text-label-md">Google</span>
</button>
<button class="flex-1 glass-tier-2 rounded-xl py-3 flex items-center justify-center gap-2 hover:bg-white/40 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">file_download</span>
<span class="font-label-md text-label-md">Apple</span>
</button>
</div>
</div>
</main>
</body></html>
