<style>
        .glass-tier-2 {
            background-color: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-top: 1.5px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }
        .orb-1 {
            background: radial-gradient(circle, rgba(146,215,139,0.4) 0%, rgba(247,251,240,0) 70%);
            animation: float 20s infinite ease-in-out;
        }
        .orb-2 {
            background: radial-gradient(circle, rgba(255,150,80,0.3) 0%, rgba(247,251,240,0) 70%);
            animation: float 25s infinite ease-in-out reverse;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

<body class="bg-background text-on-background min-h-screen relative overflow-hidden flex flex-col justify-center items-center">
<!-- Ambient Background Orbs -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<div class="orb-1 absolute top-[-10%] left-[-10%] w-[600px] h-[600px] rounded-full blur-[60px]"></div>
<div class="orb-2 absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full blur-[50px]"></div>

<!-- TopNavBar Suppressed due to Transactional/Error Context -->

<h1 class="font-display-lg text-display-lg text-primary mb-4 drop-shadow-md">
            404

<h2 class="font-headline-lg text-headline-lg text-on-surface mb-8">

        </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-12 max-w-md">

        </p>
<!-- Search Form in Thin Glass Container (Tier 2) -->
<form class="glass-tier-2 p-6 rounded-[20px] shadow-lg w-full max-w-lg mb-12 flex flex-col gap-4">
<div class="relative w-full flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline z-20">search</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-[12px] py-4 pl-12 pr-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent z-10 transition-shadow" placeholder="Search for groceries..." type="text"/>
</div>
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-full shadow-md hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2" type="submit">
<span>Search MiniMart</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Back to Home Button -->
<a class="bg-primary text-on-primary font-label-md text-label-md py-4 px-8 rounded-full shadow-md hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2" href="/">
