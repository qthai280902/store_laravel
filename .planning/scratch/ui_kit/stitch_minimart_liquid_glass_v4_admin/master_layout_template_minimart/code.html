<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MiniMart - Master Layout Template</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed": "#aef4a5",
                        "on-secondary-fixed-variant": "#743400",
                        "on-primary-fixed": "#002203",
                        "on-primary-fixed-variant": "#0e5217",
                        "on-primary-container": "#76b970",
                        "on-background": "#181d16",
                        "tertiary-container": "#741a41",
                        "on-surface": "#181d16",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e0e4d9",
                        "surface-container-highest": "#e0e4d9",
                        "surface-bright": "#f7fbf0",
                        "secondary": "#994700",
                        "surface-container-low": "#f1f5ea",
                        "error": "#ba1a1a",
                        "background": "#f7fbf0",
                        "on-tertiary-fixed": "#3e001d",
                        "on-tertiary-fixed-variant": "#7f234a",
                        "on-error": "#ffffff",
                        "outline-variant": "#c0c9bb",
                        "secondary-container": "#ff9650",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#6f3200",
                        "error-container": "#ffdad6",
                        "surface-tint": "#2b6b2c",
                        "on-surface-variant": "#41493e",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#ffb68b",
                        "surface-dim": "#d7dbd1",
                        "surface-container": "#ebefe5",
                        "primary": "#003006",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb0c8",
                        "tertiary": "#56002b",
                        "outline": "#717a6d",
                        "secondary-fixed": "#ffdbc8",
                        "inverse-on-surface": "#eef2e7",
                        "on-secondary-fixed": "#321300",
                        "primary-fixed-dim": "#92d78b",
                        "primary-container": "#00490e",
                        "surface": "#f7fbf0",
                        "surface-container-high": "#e6eadf",
                        "tertiary-fixed": "#ffd9e2",
                        "on-tertiary-container": "#f985ad",
                        "inverse-surface": "#2d322b",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#92d78b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "base_unit": "8px",
                        "margin_desktop": "40px",
                        "max_width": "1280px"
                    },
                    "fontFamily": {
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "1.2", "fontWeight": "800" }],
                        "label-md": ["14px", { "lineHeight": "1.4", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #f7fbf0;
            overflow-x: hidden;
        }
        
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background-color: #f7fbf0;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: #92d78b; /* primary-fixed-dim */
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 600px;
            height: 600px;
            background: #ffb68b; /* secondary-fixed-dim */
            bottom: -200px;
            right: -100px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            background: #ffb0c8; /* tertiary-fixed-dim */
            top: 40%;
            left: 40%;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
            100% { transform: translate(-30px, 80px) scale(0.9); }
        }

        .glass-regular {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-top: 1.5px solid rgba(255, 255, 255, 0.8);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .glass-thin {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-top: 1.5px solid rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="text-on-background font-body-lg text-body-lg antialiased flex flex-col min-h-screen">
<!-- Ambient Background -->
<div class="ambient-bg">
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
</div>
<!-- Header (TopNavBar from JSON) -->
<header class="fixed top-0 left-0 w-full z-40 flex justify-between items-center px-gutter max-w-max_width mx-auto h-20 bg-white/35 backdrop-blur-[40px] saturate-[180%] border-t-[1.5px] border-white/80 border-x-[1px] border-b-[1px] border-white/30 shadow-xl transition-all duration-300">
<div class="flex items-center gap-base_unit">
<span class="font-display-lg text-display-lg font-extrabold text-primary dark:text-primary-fixed-dim tracking-tight">MiniMart</span>
</div>
<!-- Navigation Links (Desktop) -->
<nav class="hidden md:flex gap-gutter items-center">
<a class="text-on-surface-variant font-medium font-label-md text-label-md hover:text-primary transition-colors duration-200" href="#">Categories</a>
<a class="text-on-surface-variant font-medium font-label-md text-label-md hover:text-primary transition-colors duration-200" href="#">Deals</a>
<a class="text-on-surface-variant font-medium font-label-md text-label-md hover:text-primary transition-colors duration-200" href="#">Fresh</a>
<a class="text-on-surface-variant font-medium font-label-md text-label-md hover:text-primary transition-colors duration-200" href="#">Organic</a>
</nav>
<!-- Search Bar -->
<div class="hidden lg:flex items-center bg-white rounded-[12px] border border-outline-variant px-4 py-2 w-64 shadow-sm transition-all focus-within:ring-2 focus-within:ring-primary-fixed-dim">
<span class="material-symbols-outlined text-outline mr-2" data-icon="search">search</span>
<input class="bg-transparent border-none outline-none text-on-surface w-full font-label-md text-label-md placeholder-outline placeholder:font-normal focus:ring-0 p-0 h-6" placeholder="Search..." type="text"/>
</div>
<!-- Actions -->
<div class="flex items-center gap-4 text-primary dark:text-primary-fixed-dim">
<button class="hover:text-primary transition-colors duration-200 p-2 rounded-full hover:bg-white/50">
<span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
</button>
<button class="hover:text-primary transition-colors duration-200 p-2 rounded-full hover:bg-white/50">
<span class="material-symbols-outlined" data-icon="person">person</span>
</button>
</div>
</header>
<!-- Main Content Wrapper (Accounts for fixed header) -->
<main class="flex-grow pt-24 px-4 md:px-margin_desktop lg:px-0 w-full max-w-max_width mx-auto flex flex-col gap-gutter z-10 pb-20 relative">
<!-- Breadcrumb (Thin Glass) -->
<div class="glass-thin rounded-xl py-2 px-4 flex items-center gap-2 text-on-surface-variant font-label-md text-label-md w-full">
<a class="hover:text-primary transition-colors" href="#">Home</a>
<span class="text-outline">/</span>
<span class="text-on-surface font-semibold">[Page Name]</span>
</div>
<!-- Scaffold Content Area -->
<div class="flex-grow w-full border-2 border-dashed border-outline-variant rounded-[20px] flex items-center justify-center min-h-[500px] bg-white/10 backdrop-blur-sm">
<p class="font-headline-lg md:font-headline-lg-mobile text-headline-lg md:text-headline-lg-mobile text-on-surface-variant opacity-70 text-center px-4">
                Nội dung trang sẽ được thêm ở đây
            </p>
</div>
</main>
<!-- Footer (From JSON) -->
<footer class="w-full py-margin_desktop px-gutter flex flex-col md:flex-row justify-between items-start max-w-max_width mx-auto bg-surface-container dark:bg-surface-container-highest border-t border-outline-variant z-10 relative">
<div class="mb-8 md:mb-0">
<span class="font-headline-lg text-primary block mb-4">MiniMart</span>
<p class="font-label-md text-label-md text-on-surface-variant">© 2024 MiniMart Fresh. All rights reserved.</p>
</div>
<div class="flex flex-col md:flex-row gap-6 md:gap-gutter w-full md:w-auto">
<nav class="flex flex-col gap-3">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors opacity-80 hover:opacity-100" href="#">About Us</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors opacity-80 hover:opacity-100" href="#">Sustainability</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors opacity-80 hover:opacity-100" href="#">Store Locator</a>
</nav>
<nav class="flex flex-col gap-3">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors opacity-80 hover:opacity-100" href="#">Privacy Policy</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-secondary transition-colors opacity-80 hover:opacity-100" href="#">Contact</a>
</nav>
</div>
</footer>
<script>
        // Simple script to add slight scroll effect to header
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('bg-white/60');
                header.classList.remove('bg-white/35');
            } else {
                header.classList.add('bg-white/35');
                header.classList.remove('bg-white/60');
            }
        });
    </script>
</body></html>
