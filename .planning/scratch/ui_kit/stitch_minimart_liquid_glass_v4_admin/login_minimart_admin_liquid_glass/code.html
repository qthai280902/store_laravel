<style>
        /* Ambient Orb Background Animation */
        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
            100% { transform: translateY(0) scale(1); }
        }
        .orb-1 {
            animation: float 8s ease-in-out infinite;
        }
        .orb-2 {
            animation: float 12s ease-in-out infinite reverse;
        }
        .orb-3 {
            animation: float 10s ease-in-out infinite 2s;
        }
    </style>

<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden text-on-surface">
<!-- Ambient Background -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="orb-1 absolute top-[20%] left-[10%] w-[400px] h-[400px] rounded-full bg-primary-fixed-dim/30 blur-[80px]"></div>
<div class="orb-2 absolute bottom-[10%] right-[15%] w-[500px] h-[500px] rounded-full bg-secondary-fixed-dim/20 blur-[100px]"></div>
<div class="orb-3 absolute top-[40%] right-[40%] w-[300px] h-[300px] rounded-full bg-tertiary-fixed-dim/20 blur-[90px]"></div>
</div>
<!-- Thick Glass Card -->
<main class="z-10 w-full max-w-md p-stack-gap sm:p-gutter">
<div class="bg-white/50 backdrop-blur-[50px] border border-white/60 shadow-[0_8px_32px_rgba(0,0,0,0.08)] rounded-[24px] p-gutter relative overflow-hidden">
<!-- Shimmer effect overlay -->
<div class="absolute inset-0 bg-gradient-to-br from-white/40 to-transparent pointer-events-none"></div>
<div class="relative z-10 flex flex-col gap-margin-main">
<!-- Header -->
<div class="text-center flex flex-col gap-component-gap items-center">
<div class="w-16 h-16 rounded-2xl bg-primary flex items-center justify-center shadow-lg mb-2">
<span class="material-symbols-outlined text-on-primary text-[32px]">storefront</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">MiniMart</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Admin Portal</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-gap">
<!-- Email Input -->
<div class="flex flex-col gap-component-gap">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Staff Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full bg-white border border-outline-variant rounded-[12px] pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all shadow-sm" id="email" name="email" placeholder="admin@minimart.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-component-gap">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-white border border-outline-variant rounded-[12px] pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all shadow-sm" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<div class="flex justify-end">
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg rounded-full py-3 px-6 mt-4 hover:bg-primary-container transition-colors shadow-md active:scale-[0.98] flex items-center justify-center gap-2" type="button">
                        Sign In
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="text-center border-t border-outline-variant/30 pt-stack-gap">
<p class="font-body-sm text-body-sm text-outline">Internal operations system. Authorized access only.</p>
</div>
</div>
</div>
</main>
